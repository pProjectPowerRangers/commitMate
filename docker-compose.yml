services:
  mysql:
    image: mysql:8.4
    container_name: commitmate-mysql
    environment:
      MYSQL_DATABASE: commitmate
      MYSQL_USER: commitmate
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: